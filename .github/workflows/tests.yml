name: Tests

on: pull_request

permissions:
  contents: read

jobs:
  tests:
    name: Unit and browser tests
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install chromium webkit

      - name: Enable full keyboard navigation in WebKit
        run: defaults write org.webkit.Playwright AppleKeyboardUIMode -int 3

      - name: Run browser tests
        run: npm run test:browser
